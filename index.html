* {
  box-sizing: border-box;
}

body {
  margin: 0;

  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #f8c9d1;
  background-image: radial-gradient(#fff7 2px, transparent 3px);

  align-items: center;

  position: relative;
}

.card {

}

.buttons {
  display: flex;
  justify-content: center;
  gap: 18px;
  margin-top: 24px;
}

button {

  border-radius: 30px;

  color: white;
  font-weight: bold;

  bottom: 0;
  font-size: 60px;

  justify-content: center;
  text-align: center;
  padding: 20px;
}

#result img {
  width: 140px;
  height: 140px;
  object-fit: contain;
  margin-bottom: 15px;
}

#result h1 {
  color: #2b5842;
  font-size: 24px;
  margin-bottom: 10px;
}

#result p {
  color: #3b6e55;
  font-size: 15px;
  font-weight: bold;
}
