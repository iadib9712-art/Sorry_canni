<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Sorry ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;overflow:hidden;font-family:Arial,sans-serif;background:#f8c9d1;background-image:radial-gradient(#fff7 2px,transparent 3px);background-size:35px 35px;display:flex;align-items:center;justify-content:center}
.card{width:min(88vw,340px);padding:22px 18px;text-align:center;background:#fffafa;border-radius:20px;box-shadow:0 8px 25px #9d647055;position:relative;z-index:2}
.animal{font-size:95px;background:white;border-radius:14px;padding:8px}
h2{color:#59206b;font-size:24px;margin:14px 0 10px}
p{color:#777;font-size:14px;line-height:1.5}
.buttons{display:flex;justify-content:center;gap:18px;margin-top:24px}
button{border:0;border-radius:30px;padding:12px 28px;color:white;font-weight:bold;font-size:15px;cursor:pointer}
#yes{background:#36b837}#no{background:#f01828}
.flower{position:fixed;bottom:0;font-size:60px;opacity:.65;pointer-events:none}
.f1{left:5%}.f2{right:5%}.f3{left:43%;font-size:42px}
#result{display:none;position:fixed;inset:0;width:100%;height:100%;background:#b5dfcd;z-index:30;align-items:center;justify-content:center}
#result img{display:block;width:100%;height:100%;object-fit:contain}
@media(max-width:380px){.card{padding:18px 14px}}
</style>
</head>
<body>
<div class="flower f1">🌷</div><div class="flower f2">🌸</div><div class="flower f3">🌹</div>
<div class="card" id="main">
<div class="animal">🐻</div>
<h2>I'm Sorry! 🥺</h2>
<p>I know I messed up...<br>Can you please forgive me? ❤️</p>
<div class="buttons">
<button id="yes" onclick="forgive()">Yes</button>
<button id="no" onclick="runAway()">No</button>
</div>
</div>
<div id="result"><img src="second-page.jpg" alt="Love Page"></div>
<script>
let noCount=0;
function runAway(){
 const no=document.getElementById("no");noCount++;
 no.style.position="fixed";no.style.left=Math.random()*75+"%";
 no.style.top=Math.random()*75+"%";no.style.zIndex="25";
 if(noCount>=3)no.innerText="Are you sure? 🥺";
}
function forgive(){
 document.getElementById("main").style.display="none";
 document.getElementById("result").style.display="flex";
}
</script>
</body>
</html>
